# A complete metadata stack for trying meta out: PostgreSQL, meta and the
# MangaBaka plugin. See the quick start in README.md.
#
# Until the images are published, `docker compose up --build` builds them
# from this checkout and a meta-mangabaka checkout next to it.
#
# Optional search engines (PostgreSQL searches without one):
#
#   META_SEARCH_BACKEND=typesense TYPESENSE_API_KEY=$(openssl rand -hex 24) \
#     docker compose --profile search-typesense up -d
#   META_SEARCH_BACKEND=meilisearch MEILI_MASTER_KEY=$(openssl rand -hex 24) \
#     docker compose --profile search-meilisearch up -d
#
# meta builds the index on first start and answers from PostgreSQL until
# it is ready. The engines publish no port: only meta talks to them.
#
# This is a development setup: PostgreSQL runs with a password from the
# environment and meta's database user owns its database. In production,
# give meta its own database on your PostgreSQL server (it needs no
# superuser) and keep the keys secret.
name: panelarr-meta

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: meta
      POSTGRES_USER: meta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meta}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meta", "-d", "meta"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  meta:
    image: panelarr/meta:${META_TAG:-dev}
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      meta-mangabaka:
        condition: service_started
    environment:
      META_CONFIG: /etc/meta/meta.yaml
      META_DATABASE_URL: postgres://meta:${POSTGRES_PASSWORD:-meta}@postgres:5432/meta?sslmode=disable
      META_ADMIN_TOKEN: ${META_ADMIN_TOKEN:?set META_ADMIN_TOKEN}
      MANGABAKA_PLUGIN_KEY: ${MANGABAKA_PLUGIN_KEY:?set MANGABAKA_PLUGIN_KEY}
      # postgres (default), typesense or meilisearch; the admin can change it.
      META_SEARCH_BACKEND: ${META_SEARCH_BACKEND:-postgres}
      META_TYPESENSE_URL: http://typesense:8108
      META_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}
      META_MEILISEARCH_URL: http://meilisearch:7700
      META_MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - ./compose/meta.yaml:/etc/meta/meta.yaml:ro
      # Holds the key that encrypts stored proxy passwords.
      - meta:/data
    ports:
      - "${META_PORT:-8901}:8901"
    restart: unless-stopped

  meta-mangabaka:
    image: panelarr/meta-mangabaka:${MANGABAKA_TAG:-dev}
    build:
      context: ../meta-mangabaka
      additional_contexts:
        meta: .
    environment:
      PLUGIN_API_KEY: ${MANGABAKA_PLUGIN_KEY:?set MANGABAKA_PLUGIN_KEY}
    volumes:
      # The downloaded dump lives here (about 4 GB with the default variant).
      - mangabaka:/data
    # No published port: only meta talks to the plugin.
    restart: unless-stopped

  typesense:
    profiles: [search-typesense]
    image: typesense/typesense:30.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-}", "--enable-cors=false"]
    volumes:
      # The index lives in RAM; this keeps it across restarts.
      - typesense:/data
    restart: unless-stopped

  meilisearch:
    profiles: [search-meilisearch]
    # The MIT edition: no Enterprise features are used.
    image: getmeili/meilisearch:v1.54
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data
    restart: unless-stopped

volumes:
  meta: {}
  postgres: {}
  mangabaka: {}
  typesense: {}
  meilisearch: {}
