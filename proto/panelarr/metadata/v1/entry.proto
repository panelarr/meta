syntax = "proto3";

package panelarr.metadata.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/panelarr/meta/gen/panelarr/metadata/v1;metadatav1";

// ProviderEntry is what one provider says about one catalogue item (a series,
// a novel, a comic run, ...). Plugins send these; meta stores each one as it
// arrived and builds its merged Entry on top.
//
// Every field is optional: a provider fills what it knows. Every enum travels
// with the provider's original string in a raw_* field, so nothing is lost
// when a provider's value does not fit our list.
message ProviderEntry {
  // The provider's own ID for this item. ref.provider is the plugin's
  // provider key (for example "mangabaka").
  ExternalId ref = 1;
  // The item's page at the provider, for people to follow.
  string url = 2;

  EntryType type = 3;
  string raw_type = 4;
  EntryStatus status = 5;
  string raw_status = 6;
  ContentRating content_rating = 7;
  string raw_content_rating = 8;

  // All titles: main, native, romanized, alternatives and per-language titles.
  repeated Title titles = 9;
  repeated Description descriptions = 10;
  // People and their roles (authors, artists, editors, ...).
  repeated Credit credits = 11;
  // Publishers, magazines, imprints, licensors, studios, ...
  repeated CompanyCredit companies = 12;
  repeated License licenses = 13;
  // Tags, genres included (Tag.is_genre).
  repeated TagAssignment tags = 14;
  repeated Relation relations = 15;
  repeated Adaptation adaptations = 16;
  // Known releases: chapters, volumes, issues, ...
  repeated Item items = 17;
  Progress progress = 18;
  Dates dates = 19;
  // BCP 47 language tag of the original work, e.g. "ja", "ko", "zh".
  string original_language = 20;
  repeated Image images = 21;
  repeated Link links = 22;
  // IDs of the same item at other providers. Shared IDs link provider
  // entries into one merged entry.
  repeated ExternalId external_ids = 23;
  Stats stats = 24;

  // Whether the provider still has the item as its own record.
  EntryState state = 25;
  // Set when state is ENTRY_STATE_MERGED: the provider's record this one was
  // merged into.
  ExternalId merged_into = 26;

  // When the provider last changed this record, if it says.
  google.protobuf.Timestamp updated_at = 27;
  // Who the data comes from and under which terms. Shown wherever the data is.
  Attribution attribution = 28;
  // The provider's original record, kept so nothing is lost and records can
  // be re-mapped later without a new download.
  google.protobuf.Struct raw = 29;
}

// ExternalId names an item (or person, company, tag) at one provider.
message ExternalId {
  // Provider key, lower case, e.g. "mangabaka", "anilist", "mal",
  // "mangaupdates", "kitsu", "animeplanet", "ann", "shikimori", "mangadex",
  // "comicvine", "isbn". The list is open.
  string provider = 1;
  // The provider's ID, always as a string.
  string id = 2;
  // A link to the item at the provider, if known.
  string url = 3;
}

// Attribution says where data comes from and under which terms.
message Attribution {
  // Display name, e.g. "MangaBaka".
  string provider_name = 1;
  // The provider's home page or the record's page.
  string url = 2;
  // Licence name, e.g. "CC BY-NC-SA 4.0".
  string license = 3;
  string license_url = 4;
  // A short notice to show next to the data.
  string notice = 5;
}

message Title {
  string text = 1;
  // BCP 47 tag with an optional script, e.g. "ja", "ja-Latn", "en".
  string language = 2;
  TitleKind kind = 3;
  bool is_primary = 4;
  // Free-form traits from the provider, e.g. "abbreviation", "old".
  repeated string traits = 5;
  string note = 6;
}

message Description {
  string language = 1;
  string text = 2;
  DescriptionFormat format = 3;
}

// PartialDate is a date where only some parts may be known. Many sources only
// know a year. Zero means unknown.
message PartialDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  // The provider marked the date as an estimate.
  bool estimated = 4;
}

message Dates {
  PartialDate announced = 1;
  PartialDate start = 2;
  PartialDate end = 3;
}

// Ref points at a position in a work, e.g. "volume 12", "chapter 108.5".
message Ref {
  RefUnit unit = 1;
  string raw_unit = 2;
  RefQualifier qualifier = 3;
  // A string, so "12.5" and "Extra" fit.
  string value = 4;
}

message Progress {
  Ref total = 1;
  Ref latest = 2;
  Ref final = 3;
}

// Item is a known release: a chapter, volume, issue, ...
message Item {
  RefUnit unit = 1;
  string raw_unit = 2;
  optional double number = 3;
  string value = 4;
  string name = 5;
  string description = 6;
  PartialDate release_date = 7;
  string language = 8;
  repeated Link links = 9;
}

message Period {
  PartialDate start = 1;
  PartialDate end = 2;
}

// Person is shared between entries. Providers that only know a name (plain
// author strings) send a Person with no external IDs.
message Person {
  // meta's ID. Empty in records sent by plugins; set by meta when serving.
  string id = 1;
  string name = 2;
  string name_original = 3;
  repeated string aliases = 4;
  repeated string aliases_original = 5;
  PartialDate birth = 6;
  PartialDate death = 7;
  string gender = 8;
  // ISO 3166-1 alpha-2.
  string country = 9;
  string language = 10;
  string biography = 11;
  repeated Image images = 12;
  repeated Link links = 13;
  repeated ExternalId external_ids = 14;
}

message Character {
  string name = 1;
  string name_original = 2;
}

message Credit {
  Person person = 1;
  PersonRole role = 2;
  string raw_role = 3;
  // For voice actors and actors: who they play.
  Character character = 4;
  int32 order = 5;
  string note = 6;
  Period period = 7;
}

message Company {
  // meta's ID. Empty in records sent by plugins; set by meta when serving.
  string id = 1;
  string name = 2;
  string name_original = 3;
  repeated string aliases = 4;
  repeated string aliases_original = 5;
  CompanyType type = 6;
  string raw_type = 7;
  CompanyStatus status = 8;
  PartialDate founded = 9;
  PartialDate closed = 10;
  string country = 11;
  string language = 12;
  string description = 13;
  repeated Image images = 14;
  repeated Link links = 15;
  repeated ExternalId external_ids = 16;
}

message CompanyCredit {
  Company company = 1;
  CompanyRole role = 2;
  string raw_role = 3;
  int32 order = 4;
  string note = 5;
  Period period = 6;
  repeated Link links = 7;
  // The language or market of this credit, e.g. an English publisher.
  string language = 8;
}

message License {
  string language = 1;
  bool licensed = 2;
  PartialDate date = 3;
  Company company = 4;
}

// Tag is shared between entries. Genres are tags with is_genre set.
message Tag {
  // meta's ID. Empty in records sent by plugins; set by meta when serving.
  string id = 1;
  string name = 2;
  string description = 3;
  // Name of the parent tag, for hierarchies.
  string parent = 4;
  int32 level = 5;
  // Names of tags that imply this one.
  repeated string implied_by = 6;
  bool is_genre = 7;
  bool is_spoiler = 8;
  bool is_explicit = 9;
  ContentRating content_rating = 10;
  // How many entries carry the tag. Computed by meta; providers may send
  // their own count.
  int64 entry_count = 11;
  repeated string aliases = 12;
  repeated ExternalId external_ids = 13;
}

message TagAssignment {
  Tag tag = 1;
  TagWeight weight = 2;
  string raw_weight = 3;
  // 0..1, from votes where the provider has them.
  optional double score = 4;
  // The tag is a spoiler for this entry (independent of Tag.is_spoiler).
  bool is_spoiler = 5;
}

message Relation {
  RelationType type = 1;
  string raw_type = 2;
  // The related item at the provider.
  ExternalId target = 3;
  // meta's entry ID of the target, when meta knows it. Set by meta.
  string entry_id = 4;
  // A display title for the target, when the provider sends one.
  string title = 5;
  RelationChronology chronology = 6;
  // Set by a curator rather than a provider.
  bool manual = 7;
  string note = 8;
}

// Adaptation is the work in another medium (anime, live action, games, ...),
// which may not be in meta at all.
message Adaptation {
  AdaptationType type = 1;
  string raw_type = 2;
  string title = 3;
  // Where in the source work the adaptation starts and ends.
  Ref start = 4;
  Ref end = 5;
  Dates dates = 6;
  repeated ExternalId external_ids = 7;
}

message ImageVariant {
  int32 width = 1;
  int32 height = 2;
  // Pixel density the variant is meant for: 1, 2, 3, ...
  int32 density = 3;
  string url = 4;
}

message Image {
  ImageKind kind = 1;
  string url = 2;
  // "jpeg", "png", "webp", ...
  string format = 3;
  int32 width = 4;
  int32 height = 5;
  int64 file_size = 6;
  string sha256 = 7;
  // Compact placeholders a client can draw while the image loads.
  string blurhash = 8;
  string thumbhash = 9;
  repeated ImageVariant variants = 10;
  // Covers can differ per edition or language.
  string language = 11;
}

message Link {
  LinkType type = 1;
  string raw_type = 2;
  string url = 3;
  string title = 4;
  string description = 5;
  string language = 6;
  // For social links: the platform and the handle on it.
  string platform = 7;
  string handle = 8;
}

// Stats are one provider's numbers. They are never mixed across providers,
// because ratings and popularity are not comparable between sites.
message Stats {
  // Average rating on a 0..100 scale.
  optional double rating = 1;
  optional int64 rating_count = 2;
  // A provider's popularity score: higher is more popular.
  optional double popularity = 3;
  // A provider's popularity position: 1 is the most popular.
  optional int64 popularity_rank = 4;
  // A provider's overall rank: 1 is the best.
  optional int64 rank = 5;
}

enum EntryState {
  ENTRY_STATE_UNSPECIFIED = 0;
  ENTRY_STATE_ACTIVE = 1;
  // The provider merged this record into another one (merged_into).
  ENTRY_STATE_MERGED = 2;
  // The provider no longer has the record. meta keeps it so links still work.
  ENTRY_STATE_REMOVED = 3;
}

