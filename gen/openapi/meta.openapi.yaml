          title: birth
        death:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.PartialDate'
          title: death
        gender:
          type: string
          title: gender
        country:
          type: string
          title: country
          description: ISO 3166-1 alpha-2.
        language:
          type: string
          title: language
        biography:
          type: string
          title: biography
        images:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Image'
          title: images
        links:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Link'
          title: links
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
