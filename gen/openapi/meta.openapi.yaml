            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: per
        burst:
          type: integer
          title: burst
          format: int32
          description: Calls that may go out at once before the rate applies. 0 means 1.
      title: RateLimit
      additionalProperties: false
    panelarr.metadata.v1.Ref:
      type: object
      properties:
        unit:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RefUnit'
          title: unit
        rawUnit:
          type: string
          title: raw_unit
        qualifier:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RefQualifier'
          title: qualifier
        value:
          type: string
          title: value
          description: A string, so "12.5" and "Extra" fit.
      title: Ref
      additionalProperties: false
      description: Ref points at a position in a work, e.g. "volume 12", "chapter 108.5".
    panelarr.metadata.v1.RefQualifier:
      type: string
      title: RefQualifier
      enum:
        - REF_QUALIFIER_UNSPECIFIED
        - REF_QUALIFIER_EXACT
        - REF_QUALIFIER_APPROXIMATE
        - REF_QUALIFIER_ESTIMATED
        - REF_QUALIFIER_BEFORE
        - REF_QUALIFIER_AFTER
        - REF_QUALIFIER_UP_TO
        - REF_QUALIFIER_THROUGH
        - REF_QUALIFIER_UNKNOWN
    panelarr.metadata.v1.RefUnit:
      type: string
      title: RefUnit
      enum:
        - REF_UNIT_UNSPECIFIED
        - REF_UNIT_CHAPTER
        - REF_UNIT_VOLUME
        - REF_UNIT_PART
        - REF_UNIT_ARC
        - REF_UNIT_ACT
        - REF_UNIT_SEASON
        - REF_UNIT_COUR
        - REF_UNIT_EPISODE
        - REF_UNIT_SPECIAL
        - REF_UNIT_OVA
        - REF_UNIT_ONA
        - REF_UNIT_MOVIE
        - REF_UNIT_FILM
        - REF_UNIT_SHORT
        - REF_UNIT_BOOK
        - REF_UNIT_NOVEL
        - REF_UNIT_LIGHT_NOVEL_VOLUME
        - REF_UNIT_ISSUE
        - REF_UNIT_PAGE
        - REF_UNIT_ROUTE
        - REF_UNIT_SCENARIO
        - REF_UNIT_GAME
        - REF_UNIT_DLC
        - REF_UNIT_STAGE
        - REF_UNIT_TRACK
        - REF_UNIT_WHOLE_WORK
        - REF_UNIT_OTHER
        - REF_UNIT_UNKNOWN
    panelarr.metadata.v1.Relation:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RelationType'
          title: type
        rawType:
          type: string
          title: raw_type
        target:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: target
          description: The related item at the provider.
        entryId:
          type: string
          title: entry_id
          description: meta's entry ID of the target, when meta knows it. Set by meta.
        title:
          type: string
          title: title
          description: A display title for the target, when the provider sends one.
        chronology:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RelationChronology'
          title: chronology
        manual:
          type: boolean
          title: manual
          description: Set by a curator rather than a provider.
        note:
          type: string
          title: note
      title: Relation
      additionalProperties: false
    panelarr.metadata.v1.RelationChronology:
      type: string
      title: RelationChronology
      enum:
        - RELATION_CHRONOLOGY_UNSPECIFIED
        - RELATION_CHRONOLOGY_NARRATIVE
        - RELATION_CHRONOLOGY_RELEASE
        - RELATION_CHRONOLOGY_UNKNOWN
    panelarr.metadata.v1.RelationType:
      type: string
      title: RelationType
      enum:
        - RELATION_TYPE_UNSPECIFIED
        - RELATION_TYPE_ADAPTATION
        - RELATION_TYPE_ALTERNATIVE
        - RELATION_TYPE_CAMEO
        - RELATION_TYPE_CHARACTER_FOCUS
        - RELATION_TYPE_COMPILATION
        - RELATION_TYPE_CONTAINS
        - RELATION_TYPE_CROSSOVER
        - RELATION_TYPE_EXPANSION
        - RELATION_TYPE_MAIN
        - RELATION_TYPE_PARENT
        - RELATION_TYPE_PARODY
        - RELATION_TYPE_PREQUEL
        - RELATION_TYPE_REBOOT
        - RELATION_TYPE_REMAKE
        - RELATION_TYPE_SEQUEL
        - RELATION_TYPE_SERIES
        - RELATION_TYPE_SIDE_STORY
        - RELATION_TYPE_SOURCE
        - RELATION_TYPE_SPIN_OFF
        - RELATION_TYPE_SUMMARY
        - RELATION_TYPE_UNCOLLECTED
        - RELATION_TYPE_OTHER
    panelarr.metadata.v1.Stats:
      type: object
      properties:
        rating:
          type:
            - number
            - "null"
          title: rating
          format: double
          description: Average rating on a 0..100 scale.
        ratingCount:
          type:
            - string
            - "null"
          title: rating_count
          format: int64
        popularity:
          type:
            - number
            - "null"
          title: popularity
          format: double
          description: 'A provider''s popularity score: higher is more popular.'
        popularityRank:
          type:
            - string
            - "null"
          title: popularity_rank
          format: int64
          description: 'A provider''s popularity position: 1 is the most popular.'
        rank:
          type:
            - string
            - "null"
          title: rank
          format: int64
          description: 'A provider''s overall rank: 1 is the best.'
      title: Stats
      additionalProperties: false
      description: |-
        Stats are one provider's numbers. They are never mixed across providers,
         because ratings and popularity are not comparable between sites.
    panelarr.metadata.v1.Tag:
      type: object
      properties:
        id:
          type: string
          title: id
          description: meta's ID. Empty in records sent by plugins; set by meta when serving.
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        parent:
          type: string
          title: parent
          description: Name of the parent tag, for hierarchies.
        level:
          type: integer
          title: level
          format: int32
        impliedBy:
          type: array
          items:
            type: string
          title: implied_by
          description: Names of tags that imply this one.
        isGenre:
          type: boolean
          title: is_genre
        isSpoiler:
          type: boolean
          title: is_spoiler
        isExplicit:
          type: boolean
          title: is_explicit
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        entryCount:
          type: string
          title: entry_count
          format: int64
          description: |-
            How many entries carry the tag. Computed by meta; providers may send
             their own count.
        aliases:
          type: array
          items:
            type: string
          title: aliases
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: external_ids
      title: Tag
      additionalProperties: false
      description: Tag is shared between entries. Genres are tags with is_genre set.
    panelarr.metadata.v1.TagAssignment:
      type: object
      properties:
        tag:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Tag'
          title: tag
        weight:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.TagWeight'
          title: weight
        rawWeight:
          type: string
          title: raw_weight
        score:
          type:
            - number
            - "null"
          title: score
          format: double
          description: 0..1, from votes where the provider has them.
        isSpoiler:
          type: boolean
          title: is_spoiler
          description: The tag is a spoiler for this entry (independent of Tag.is_spoiler).
      title: TagAssignment
      additionalProperties: false
    panelarr.metadata.v1.TagWeight:
      type: string
      title: TagWeight
      enum:
        - TAG_WEIGHT_UNSPECIFIED
        - TAG_WEIGHT_CORE
        - TAG_WEIGHT_DEFINING
        - TAG_WEIGHT_RECURRENT
        - TAG_WEIGHT_INCIDENTAL
        - TAG_WEIGHT_UNWEIGHTED
    panelarr.metadata.v1.Title:
      type: object
      properties:
        text:
          type: string
          title: text
        language:
          type: string
          title: language
          description: BCP 47 tag with an optional script, e.g. "ja", "ja-Latn", "en".
        kind:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.TitleKind'
          title: kind
        isPrimary:
          type: boolean
          title: is_primary
        traits:
          type: array
          items:
            type: string
          title: traits
          description: Free-form traits from the provider, e.g. "abbreviation", "old".
        note:
          type: string
          title: note
      title: Title
      additionalProperties: false
    panelarr.metadata.v1.TitleKind:
      type: string
      title: TitleKind
      enum:
        - TITLE_KIND_UNSPECIFIED
        - TITLE_KIND_OFFICIAL
        - TITLE_KIND_NATIVE
        - TITLE_KIND_ROMANIZED
        - TITLE_KIND_ALTERNATIVE
        - TITLE_KIND_UNOFFICIAL
        - TITLE_KIND_UNKNOWN
paths:
  /v1/admin/entries/{id}/refresh:
    post:
      tags:
        - MetaAdminService
      summary: RefreshEntry
      description: |-
        RefreshEntry asks the providers behind an entry for fresh data through
         their lookup ingestion, and returns once it is stored.
      operationId: MetaAdminService_RefreshEntry
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RefreshEntryResponse'
  /v1/admin/providers:
    get:
      tags:
        - MetaAdminService
      summary: ListProviders
      description: |-
        ListProviders lists the configured metadata plugins with what they
         support, their health and their last sync.
      operationId: MetaAdminService_ListProviders
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListProvidersResponse'
  /v1/admin/providers/{provider}/sync:
    post:
      tags:
        - MetaAdminService
      summary: RunSync
      description: |-
        RunSync starts a dump or delta sync now. It returns at once with the new
         run; follow it with GetSyncRun.
      operationId: MetaAdminService_RunSync
      parameters:
        - name: provider
          in: path
          description: The provider path parameter.
          required: true
          schema:
            type: string
            title: provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  title: kind
                  description: '"dump" or "delta".'
                force:
                  type: boolean
                  title: force
                  description: Run even if the plugin reports nothing changed.
              title: RunSyncRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RunSyncResponse'
  /v1/admin/sync-runs:
    get:
      tags:
        - MetaAdminService
      summary: ListSyncRuns
      description: ListSyncRuns lists sync runs, newest first.
      operationId: MetaAdminService_ListSyncRuns
      parameters:
        - name: provider
          in: query
          description: Only runs of this provider.
          schema:
            type: string
            title: provider
        - name: pageSize
          in: query
          description: 1..100, default 20.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListSyncRunsResponse'
  /v1/admin/sync-runs/{id}:
    get:
      tags:
        - MetaAdminService
      summary: GetSyncRun
      description: GetSyncRun returns one sync run.
      operationId: MetaAdminService_GetSyncRun
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetSyncRunResponse'
  /v1/entries:
    get:
      tags:
        - MetaService
      summary: Browse
      description: |-
        Browse lists entries with filters and a sort order, for discovery pages
         such as "popular manhwa" or "completed romance from 2015 on".
      operationId: MetaService_Browse
      parameters:
        - name: filter.genres
          in: query
          description: Genre names.
          schema:
            type: array
            items:
              type: string
            title: genres
        - name: filter.tags
          in: query
          description: Tag names. An entry must have all of them.
          schema:
            type: array
            items:
              type: string
            title: tags
        - name: filter.excludeTags
          in: query
          description: Tag or genre names to leave out.
          schema:
            type: array
            items:
              type: string
            title: exclude_tags
        - name: filter.types
          in: query
          description: The filter.types query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
            title: types
        - name: filter.statuses
          in: query
          description: The filter.statuses query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
            title: statuses
        - name: filter.contentRatings
          in: query
          description: The filter.contentRatings query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
            title: content_ratings
        - name: filter.languages
          in: query
          description: Original languages (BCP 47), e.g. "ja", "ko".
          schema:
            type: array
            items:
              type: string
            title: languages
        - name: filter.yearFrom
          in: query
          description: Start year range, inclusive. 0 means open.
          schema:
            type: integer
            title: year_from
            format: int32
        - name: filter.yearTo
          in: query
          description: The filter.yearTo query parameter.
          schema:
            type: integer
            title: year_to
            format: int32
        - name: filter.titleLanguages
          in: query
          description: Only entries with titles in one of these languages.
          schema:
            type: array
            items:
              type: string
            title: title_languages
        - name: filter.includeInactive
          in: query
          description: Include merged and removed entries. Off by default.
          schema:
            type: boolean
            title: include_inactive
        - name: sort
          in: query
          description: The sort query parameter.
          schema:
            allOf:
              - $ref: '#/components/schemas/panelarr.meta.v1.SortField'
            title: sort
        - name: reverse
          in: query
          description: Reverse the sort's natural direction.
          schema:
            type: boolean
            title: reverse
        - name: pageSize
          in: query
          description: 1..100, default 24.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
        - name: language
          in: query
          description: Preferred language for display titles (BCP 47).
          schema:
            type: string
            title: language
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.BrowseResponse'
  /v1/entries/{id}:
    get:
      tags:
        - MetaService
      summary: GetEntry
      description: |-
        GetEntry returns one entry with full details and attribution. IDs of
         entries that were merged into another resolve to the surviving entry.
      operationId: MetaService_GetEntry
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
        - name: language
          in: query
          description: The language query parameter.
          schema:
            type: string
            title: language
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetEntryResponse'
  /v1/lookup/{provider}/{externalId}:
    get:
      tags:
        - MetaService
      summary: LookupExternal
      description: |-
        LookupExternal finds the entry for an ID at another provider, e.g.
         anilist 30013. When meta doesn't know the ID yet, it may ask a plugin that
         can look it up.
      operationId: MetaService_LookupExternal
      parameters:
        - name: provider
          in: path
          description: Provider key, e.g. "anilist", "mal", "mangabaka".
          required: true
          schema:
            type: string
            title: provider
        - name: externalId
          in: path
          description: The externalId path parameter.
          required: true
          schema:
            type: string
            title: external_id
        - name: refresh
          in: query
          description: Ask a plugin even if meta already knows the ID, to get fresh data.
          schema:
            type: boolean
            title: refresh
        - name: language
          in: query
          description: The language query parameter.
          schema:
            type: string
            title: language
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.LookupExternalResponse'
  /v1/search:
    get:
      tags:
        - MetaService
      summary: Search
      description: |-
        Search finds entries by title in every language (main, native,
         romanized and alternative titles) and by the people credited on them.
      operationId: MetaService_Search
      parameters:
        - name: query
          in: query
          description: The query query parameter.
          schema:
            type: string
            title: query
        - name: filter.genres
          in: query
          description: Genre names.
          schema:
            type: array
            items:
              type: string
            title: genres
        - name: filter.tags
          in: query
          description: Tag names. An entry must have all of them.
          schema:
            type: array
            items:
              type: string
            title: tags
        - name: filter.excludeTags
          in: query
          description: Tag or genre names to leave out.
          schema:
            type: array
            items:
              type: string
            title: exclude_tags
        - name: filter.types
          in: query
          description: The filter.types query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
            title: types
        - name: filter.statuses
          in: query
          description: The filter.statuses query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
            title: statuses
        - name: filter.contentRatings
          in: query
          description: The filter.contentRatings query parameter.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
            title: content_ratings
        - name: filter.languages
          in: query
          description: Original languages (BCP 47), e.g. "ja", "ko".
          schema:
            type: array
            items:
              type: string
            title: languages
        - name: filter.yearFrom
          in: query
          description: Start year range, inclusive. 0 means open.
          schema:
            type: integer
            title: year_from
            format: int32
        - name: filter.yearTo
          in: query
          description: The filter.yearTo query parameter.
          schema:
            type: integer
            title: year_to
            format: int32
        - name: filter.titleLanguages
          in: query
          description: Only entries with titles in one of these languages.
          schema:
            type: array
            items:
              type: string
            title: title_languages
        - name: filter.includeInactive
          in: query
          description: Include merged and removed entries. Off by default.
          schema:
            type: boolean
            title: include_inactive
        - name: sort
          in: query
          description: Defaults to relevance.
          schema:
            allOf:
              - $ref: '#/components/schemas/panelarr.meta.v1.SortField'
            title: sort
        - name: reverse
          in: query
          description: The reverse query parameter.
          schema:
            type: boolean
            title: reverse
        - name: pageSize
          in: query
          description: The pageSize query parameter.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
        - name: language
          in: query
          description: The language query parameter.
          schema:
            type: string
            title: language
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.SearchResponse'
  /v1/tags:
    get:
      tags:
        - MetaService
      summary: ListTags
      description: |-
        ListTags lists the tags and genres meta knows, with entry counts, for
         building browse filters.
      operationId: MetaService_ListTags
      parameters:
        - name: genresOnly
          in: query
          description: Only genres.
          schema:
            type: boolean
            title: genres_only
        - name: prefix
          in: query
          description: Prefix filter on the name, case-insensitive.
          schema:
            type: string
            title: prefix
        - name: pageSize
          in: query
          description: 1..1000, default 200.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListTagsResponse'
tags:
  - name: MetaAdminService
    description: MetaAdminService manages providers and their syncs.
  - name: MetaService
    description: |-
      MetaService serves meta's catalogue: discovery (browse), search and
       details over every entry meta knows, not only those in a library.

       Every RPC is available over gRPC, Connect and plain HTTP/JSON (the paths
       in the annotations below).
