    panelarr.metadata.v1.NetworkProfile:
      type: object
      properties:
        name:
          type: string
          title: name
          description: Name of the profile on the host, for display and logs.
        proxy:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Proxy'
          title: proxy
          description: Unset means a direct connection.
        solver:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Solver'
          title: solver
          description: Unset means no challenge solver.
        rateLimit:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.NetworkRateLimit'
          title: rate_limit
          description: Unset means the plugin's default.
        concurrency:
          type: integer
          title: concurrency
          description: Maximum parallel requests. 0 means the plugin's default.
        userAgent:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.UserAgent'
          title: user_agent
          description: Unset means the plugin's default user agent.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: Extra headers added to every request.
        timeouts:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Timeouts'
          title: timeouts
        dohUrl:
          type: string
          title: doh_url
          description: |-
            DNS-over-HTTPS resolver URL (https://), e.g.
             https://cloudflare-dns.com/dns-query. Empty means the system resolver.
             Ignored when a proxy is set: the proxy resolves names.
      title: NetworkProfile
      additionalProperties: false
      description: |-
        NetworkProfile is everything a plugin needs to make requests for a
         provider: which proxy to go through, which challenge solver to ask, how
         fast to go and what to send. A host hands it to plugins that declare the
         `network_profile` common service.
    panelarr.metadata.v1.NetworkRateLimit:
      type: object
      properties:
        requests:
          type: integer
          title: requests
          description: Requests allowed per period.
        period:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: period
        burst:
          type: integer
          title: burst
          description: Extra requests allowed in a burst. 0 means none.
        perHost:
          type: boolean
          title: per_host
          description: Count requests per target host instead of for the whole provider.
      title: NetworkRateLimit
      additionalProperties: false
    panelarr.metadata.v1.NoticeLevel:
      type: string
      title: NoticeLevel
      enum:
        - NOTICE_LEVEL_UNSPECIFIED
        - NOTICE_LEVEL_INFO
        - NOTICE_LEVEL_WARNING
        - NOTICE_LEVEL_ERROR
    panelarr.metadata.v1.PartialDate:
      type: object
