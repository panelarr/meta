        name:
          type: string
          title: name
        nameOriginal:
          type: string
          title: name_original
        aliases:
          type: array
          items:
            type: string
          title: aliases
        aliasesOriginal:
          type: array
          items:
            type: string
          title: aliases_original
        birth:
          allOf:
