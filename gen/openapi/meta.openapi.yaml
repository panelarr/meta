        - PERSON_ROLE_COMPOSER
        - PERSON_ROLE_VOICE_ACTOR
        - PERSON_ROLE_ACTOR
        - PERSON_ROLE_TRANSLATOR
        - PERSON_ROLE_EDITOR
        - PERSON_ROLE_PUBLISHER
        - PERSON_ROLE_STUDIO_STAFF
        - PERSON_ROLE_OTHER
        - PERSON_ROLE_UNKNOWN
    panelarr.metadata.v1.PluginInfo:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable plugin ID, lower case, e.g. "mangabaka".
        name:
          type: string
          title: name
        version:
          type: string
          title: version
        description:
          type: string
          title: description
        homepage:
          type: string
          title: homepage
        provider:
          type: string
          title: provider
          description: |-
            The provider key the plugin uses in ExternalId.provider for its own
             records. Usually the same as id.
        protocols:
          type: array
          items:
            type: string
          title: protocols
          description: Protocol packages the plugin speaks, e.g. "panelarr.metadata.v1".
        ingestions:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Ingestion'
          title: ingestions
          description: The ingestion types the plugin supports, with their limits.
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: |-
            What kind of data the plugin can provide. Well-known values: "titles",
             "descriptions", "people", "companies", "tags", "covers", "relations",
             "adaptations", "items", "links", "external_ids", "stats", "characters",
             "lookup_by_external_id". The list is open.
        commonServices:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.CommonService'
          title: common_services
          description: Services the host can offer that the plugin can use.
        attribution:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Attribution'
          title: attribution
          description: Default attribution for the plugin's records.
      title: PluginInfo
      additionalProperties: false
    panelarr.metadata.v1.Progress:
      type: object
      properties:
        total:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Ref'
          title: total
        latest:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Ref'
          title: latest
        final:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Ref'
          title: final
      title: Progress
      additionalProperties: false
    panelarr.metadata.v1.Proxy:
      type: object
      properties:
        url:
          type: string
          title: url
          description: http://, https:// or socks5:// URL without credentials.
        username:
          type: string
          title: username
        password:
          type: string
          title: password
      title: Proxy
      additionalProperties: false
    panelarr.metadata.v1.RateLimit:
      type: object
      properties:
        operation:
          type: string
          title: operation
          description: |-
            The operation the limit applies to: "search", "get", "sync", or "*" for
             every call of the ingestion type.
        requests:
          type: integer
          title: requests
          format: int32
          description: At most `requests` calls per `per`.
        per:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: per
        burst:
          type: integer
          title: burst
          format: int32
          description: Calls that may go out at once before the rate applies. 0 means 1.
      title: RateLimit
      additionalProperties: false
    panelarr.metadata.v1.Ref:
