        - REF_UNIT_DLC
        - REF_UNIT_STAGE
        - REF_UNIT_TRACK
        - REF_UNIT_WHOLE_WORK
        - REF_UNIT_OTHER
        - REF_UNIT_UNKNOWN
    panelarr.metadata.v1.Relation:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RelationType'
          title: type
        rawType:
          type: string
          title: raw_type
        target:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: target
          description: The related item at the provider.
        entryId:
          type: string
          title: entry_id
          description: meta's entry ID of the target, when meta knows it. Set by meta.
        title:
          type: string
          title: title
          description: A display title for the target, when the provider sends one.
        chronology:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RelationChronology'
          title: chronology
        manual:
          type: boolean
          title: manual
          description: Set by a curator rather than a provider.
        note:
          type: string
          title: note
      title: Relation
      additionalProperties: false
    panelarr.metadata.v1.RelationChronology:
      type: string
      title: RelationChronology
      enum:
        - RELATION_CHRONOLOGY_UNSPECIFIED
        - RELATION_CHRONOLOGY_NARRATIVE
        - RELATION_CHRONOLOGY_RELEASE
        - RELATION_CHRONOLOGY_UNKNOWN
    panelarr.metadata.v1.RelationType:
      type: string
      title: RelationType
      enum:
        - RELATION_TYPE_UNSPECIFIED
        - RELATION_TYPE_ADAPTATION
        - RELATION_TYPE_ALTERNATIVE
        - RELATION_TYPE_CAMEO
        - RELATION_TYPE_CHARACTER_FOCUS
        - RELATION_TYPE_COMPILATION
        - RELATION_TYPE_CONTAINS
        - RELATION_TYPE_CROSSOVER
        - RELATION_TYPE_EXPANSION
        - RELATION_TYPE_MAIN
        - RELATION_TYPE_PARENT
        - RELATION_TYPE_PARODY
        - RELATION_TYPE_PREQUEL
        - RELATION_TYPE_REBOOT
        - RELATION_TYPE_REMAKE
        - RELATION_TYPE_SEQUEL
        - RELATION_TYPE_SERIES
        - RELATION_TYPE_SIDE_STORY
        - RELATION_TYPE_SOURCE
        - RELATION_TYPE_SPIN_OFF
        - RELATION_TYPE_SUMMARY
        - RELATION_TYPE_UNCOLLECTED
        - RELATION_TYPE_OTHER
    panelarr.metadata.v1.Solver:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.SolverType'
          title: type
        url:
          type: string
          title: url
          description: Base URL, e.g. http://flaresolverr:8191.
        sessionTtl:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: session_ttl
          description: How long clearance cookies from one solve are reused.
        maxTimeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: max_timeout
          description: Upper bound for one solve.
        asResponseFallback:
          type: boolean
          title: as_response_fallback
          description: Use the solver's own response body when a fresh request still fails.
      title: Solver
      additionalProperties: false
    panelarr.metadata.v1.SolverType:
      type: string
      title: SolverType
      enum:
        - SOLVER_TYPE_UNSPECIFIED
        - SOLVER_TYPE_FLARESOLVERR
        - SOLVER_TYPE_BYPARR
    panelarr.metadata.v1.Stats:
      type: object
      properties:
        rating:
          type:
            - number
            - "null"
          title: rating
          format: double
          description: Average rating on a 0..100 scale.
        ratingCount:
          type:
            - string
            - "null"
          title: rating_count
          format: int64
        popularity:
          type:
            - number
            - "null"
          title: popularity
          format: double
          description: 'A provider''s popularity score: higher is more popular.'
        popularityRank:
          type:
            - string
            - "null"
          title: popularity_rank
          format: int64
          description: 'A provider''s popularity position: 1 is the most popular.'
        rank:
          type:
            - string
            - "null"
          title: rank
          format: int64
          description: 'A provider''s overall rank: 1 is the best.'
      title: Stats
      additionalProperties: false
      description: |-
        Stats are one provider's numbers. They are never mixed across providers,
         because ratings and popularity are not comparable between sites.
    panelarr.metadata.v1.Tag:
      type: object
      properties:
        id:
          type: string
          title: id
          description: meta's ID. Empty in records sent by plugins; set by meta when serving.
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        parent:
          type: string
          title: parent
          description: Name of the parent tag, for hierarchies.
        level:
          type: integer
          title: level
          format: int32
        impliedBy:
          type: array
          items:
            type: string
          title: implied_by
          description: Names of tags that imply this one.
        isGenre:
          type: boolean
          title: is_genre
        isSpoiler:
          type: boolean
          title: is_spoiler
        isExplicit:
          type: boolean
          title: is_explicit
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        entryCount:
          type: string
          title: entry_count
          format: int64
          description: |-
            How many entries carry the tag. Computed by meta; providers may send
             their own count.
        aliases:
          type: array
          items:
            type: string
          title: aliases
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: external_ids
        path:
          type: array
          items:
            type: string
          title: path
          description: |-
            Names of the ancestors, root first, e.g. ["Settings"] for "Settings >
             Fantasy". Empty for top-level tags and for genres.
        key:
          type: string
          title: key
          description: |-
            meta's stable key for the tag, used in filters: "genre/fantasy",
             "tag/settings/fantasy". Set by meta when serving.
      title: Tag
      additionalProperties: false
      description: |-
        Tag is shared between entries. Genres are tags with is_genre set.

         A tag is identified by its kind and path, not by its name alone: the genre
         "Fantasy" and a tag "Settings > Fantasy" are different tags.
    panelarr.metadata.v1.TagAssignment:
      type: object
      properties:
        tag:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Tag'
          title: tag
        weight:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.TagWeight'
          title: weight
        rawWeight:
          type: string
          title: raw_weight
        score:
          type:
            - number
            - "null"
          title: score
          format: double
          description: 0..1, from votes where the provider has them.
        isSpoiler:
          type: boolean
          title: is_spoiler
          description: The tag is a spoiler for this entry (independent of Tag.is_spoiler).
      title: TagAssignment
      additionalProperties: false
    panelarr.metadata.v1.TagWeight:
      type: string
      title: TagWeight
      enum:
        - TAG_WEIGHT_UNSPECIFIED
        - TAG_WEIGHT_CORE
        - TAG_WEIGHT_DEFINING
        - TAG_WEIGHT_RECURRENT
        - TAG_WEIGHT_INCIDENTAL
        - TAG_WEIGHT_UNWEIGHTED
    panelarr.metadata.v1.Timeouts:
      type: object
      properties:
        connect:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: connect
        read:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: read
          description: Time to wait for response data.
        call:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: call
          description: The whole call, including redirects and retries.
      title: Timeouts
      additionalProperties: false
    panelarr.metadata.v1.Title:
      type: object
      properties:
        text:
          type: string
          title: text
        language:
          type: string
          title: language
          description: BCP 47 tag with an optional script, e.g. "ja", "ja-Latn", "en".
        kind:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.TitleKind'
          title: kind
        isPrimary:
          type: boolean
          title: is_primary
        traits:
          type: array
          items:
            type: string
          title: traits
          description: Free-form traits from the provider, e.g. "abbreviation", "old".
        note:
          type: string
          title: note
      title: Title
      additionalProperties: false
    panelarr.metadata.v1.TitleKind:
      type: string
      title: TitleKind
      enum:
        - TITLE_KIND_UNSPECIFIED
        - TITLE_KIND_OFFICIAL
        - TITLE_KIND_NATIVE
        - TITLE_KIND_ROMANIZED
        - TITLE_KIND_ALTERNATIVE
        - TITLE_KIND_UNOFFICIAL
        - TITLE_KIND_UNKNOWN
    panelarr.metadata.v1.UserAgent:
      type: object
      anyOf:
        - type: object
          properties:
            fixed:
              type: string
              title: fixed
              description: Always send this user agent.
          title: fixed
        - type: object
          properties:
            fromSolver:
              type: boolean
              title: from_solver
              description: The user agent the solver reports, so it matches its clearance cookies.
          title: from_solver
        - type: object
          properties:
            randomDesktop:
              type: boolean
              title: random_desktop
              description: A desktop browser's user agent, stable per provider.
          title: random_desktop
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - fixed
              - required:
                  - fromSolver
              - required:
                  - randomDesktop
          - not:
              oneOf:
                - required:
                    - fixed
                - required:
                    - fromSolver
                - required:
                    - randomDesktop
      title: UserAgent
paths:
  /v1/admin/assignments:
    get:
      tags:
        - MetaIntegrationsService
      summary: ListAssignments
      description: ListAssignments lists which profile each configured provider uses and why.
      operationId: MetaIntegrationsService_ListAssignments
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListAssignmentsResponse'
  /v1/admin/assignments/{providerId}:
    put:
      tags:
        - MetaIntegrationsService
      summary: AssignProfile
      description: |-
        AssignProfile sets the profile of one provider. An empty profile_id
         removes the assignment, so the provider falls back to the default profile.
      operationId: MetaIntegrationsService_AssignProfile
      parameters:
        - name: providerId
          in: path
          description: The providerId path parameter.
          required: true
          schema:
            type: string
            title: provider_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId:
                  type: string
                  title: profile_id
              title: AssignProfileRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.AssignProfileResponse'
  /v1/admin/clients:
    get:
      tags:
        - MetaClientsService
      summary: ListClients
      operationId: MetaClientsService_ListClients
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListClientsResponse'
    post:
      tags:
        - MetaClientsService
      summary: CreateClient
      description: |-
        CreateClient creates a client and returns its API key. The key is never
         shown again.
      operationId: MetaClientsService_CreateClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.CreateClientRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.CreateClientResponse'
  /v1/admin/clients/{clientId}:
    delete:
      tags:
        - MetaClientsService
      summary: DeleteClient
      operationId: MetaClientsService_DeleteClient
      parameters:
        - name: clientId
          in: path
          description: The clientId path parameter.
          required: true
          schema:
            type: string
            title: client_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.DeleteClientResponse'
    patch:
      tags:
        - MetaClientsService
      summary: UpdateClient
      description: UpdateClient changes a client's name or scopes. The key stays the same.
      operationId: MetaClientsService_UpdateClient
      parameters:
        - name: clientId
          in: path
          description: The clientId path parameter.
          required: true
          schema:
            type: string
            title: client_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  title: name
                  description: New name. Empty keeps the current one.
                scopes:
                  type: array
                  items:
                    type: string
                  title: scopes
                  description: New scopes. Empty keeps the current ones.
              title: UpdateClientRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.UpdateClientResponse'
  /v1/admin/clients/{clientId}/rotate:
    post:
      tags:
        - MetaClientsService
      summary: RotateClientKey
      description: |-
        RotateClientKey replaces a client's API key. The old key stops working at
         once.
      operationId: MetaClientsService_RotateClientKey
      parameters:
        - name: clientId
          in: path
          description: The clientId path parameter.
          required: true
          schema:
            type: string
            title: client_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RotateClientKeyResponse'
  /v1/admin/decision-judge:
    get:
      tags:
        - MetaDuplicatesService
      summary: GetDecisionJudge
      description: |-
        GetDecisionJudge returns the decision model settings in force. The API
         key is never returned.
      operationId: MetaDuplicatesService_GetDecisionJudge
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetDecisionJudgeResponse'
    put:
      tags:
        - MetaDuplicatesService
      summary: PutDecisionJudge
      description: |-
        PutDecisionJudge saves decision model settings; they win over the
         configuration file. An empty api_key keeps the stored one for the same
         kind and URL.
      operationId: MetaDuplicatesService_PutDecisionJudge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.PutDecisionJudgeRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.PutDecisionJudgeResponse'
  /v1/admin/decision-judge:reset:
    post:
      tags:
        - MetaDuplicatesService
      summary: ResetDecisionJudge
      description: |-
        ResetDecisionJudge forgets the admin's settings and uses the
         configuration file's.
      operationId: MetaDuplicatesService_ResetDecisionJudge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.ResetDecisionJudgeRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ResetDecisionJudgeResponse'
  /v1/admin/decision-judge:test:
    post:
      tags:
        - MetaDuplicatesService
      summary: TestDecisionJudge
      description: |-
        TestDecisionJudge asks the model about a made-up pair without saving
         the settings. It costs a few hundred tokens.
      operationId: MetaDuplicatesService_TestDecisionJudge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.TestDecisionJudgeRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.TestDecisionJudgeResponse'
  /v1/admin/default-profile:
    put:
      tags:
        - MetaIntegrationsService
      summary: SetDefaultProfile
      description: |-
        SetDefaultProfile sets the profile used by providers without an
         assignment. An empty profile_id means a direct connection.
      operationId: MetaIntegrationsService_SetDefaultProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.SetDefaultProfileRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.SetDefaultProfileResponse'
  /v1/admin/duplicates:
    get:
      tags:
        - MetaDuplicatesService
      summary: ListDuplicates
      description: ListDuplicates lists pairs, best score first.
      operationId: MetaDuplicatesService_ListDuplicates
      parameters:
        - name: status
          in: query
          description: 'Default: open pairs.'
          schema:
            allOf:
              - $ref: '#/components/schemas/panelarr.meta.v1.DuplicateStatus'
            title: status
        - name: minScore
          in: query
          description: The minScore query parameter.
          schema:
            type: number
            title: min_score
            format: double
        - name: judgedOnly
          in: query
          description: Only pairs the decision model rated.
          schema:
            type: boolean
            title: judged_only
        - name: pageSize
          in: query
          description: 1..100, default 20.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListDuplicatesResponse'
  /v1/admin/duplicates/{id}:
    get:
      tags:
        - MetaDuplicatesService
      summary: GetDuplicate
      description: GetDuplicate returns one pair.
      operationId: MetaDuplicatesService_GetDuplicate
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
            format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetDuplicateResponse'
  /v1/admin/duplicates/{id}:confirm:
    post:
      tags:
        - MetaDuplicatesService
      summary: ConfirmDuplicate
      description: |-
        ConfirmDuplicate merges the pair into one entry: the other entry's
         records move over, and its ID redirects to the one that stays.
      operationId: MetaDuplicatesService_ConfirmDuplicate
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep:
                  type: string
                  title: keep
                  description: 'The entry that stays: "a" or "b". Empty keeps the more popular one.'
                note:
                  type: string
                  title: note
              title: ConfirmDuplicateRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ConfirmDuplicateResponse'
  /v1/admin/duplicates/{id}:dismiss:
    post:
      tags:
        - MetaDuplicatesService
      summary: DismissDuplicate
      description: |-
        DismissDuplicate records that the two are different works. The pair
         never comes back.
      operationId: MetaDuplicatesService_DismissDuplicate
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  title: note
              title: DismissDuplicateRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.DismissDuplicateResponse'
  /v1/admin/duplicates/{id}:reopen:
    post:
      tags:
        - MetaDuplicatesService
      summary: ReopenDuplicate
      description: ReopenDuplicate takes back a dismissal.
      operationId: MetaDuplicatesService_ReopenDuplicate
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
            format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ReopenDuplicateResponse'
  /v1/admin/entries/{id}/refresh:
    post:
      tags:
        - MetaAdminService
      summary: RefreshEntry
      description: |-
        RefreshEntry asks the providers behind an entry for fresh data through
         their lookup ingestion, and returns once it is stored.
      operationId: MetaAdminService_RefreshEntry
      parameters:
        - name: id
          in: path
          description: The id path parameter.
          required: true
          schema:
            type: string
            title: id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RefreshEntryResponse'
  /v1/admin/health:
    get:
      tags:
        - MetaAdminService
      summary: GetHealth
      description: |-
        GetHealth reports the health of meta's parts: the database, the search
         backend and every provider's plugin.
      operationId: MetaAdminService_GetHealth
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetHealthResponse'
  /v1/admin/job-runs/{runId}:
    get:
      tags:
        - MetaJobsService
      summary: GetJobRun
      description: GetJobRun returns one run with its notes and progress.
      operationId: MetaJobsService_GetJobRun
      parameters:
        - name: runId
          in: path
          description: The runId path parameter.
          required: true
          schema:
            type: string
            title: run_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetJobRunResponse'
  /v1/admin/job-runs/{runId}:cancel:
    post:
      tags:
        - MetaJobsService
      summary: CancelJobRun
      description: |-
        CancelJobRun stops a running run. Jobs that can't stop midway answer
         FAILED_PRECONDITION.
      operationId: MetaJobsService_CancelJobRun
      parameters:
        - name: runId
          in: path
          description: The runId path parameter.
          required: true
          schema:
            type: string
            title: run_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.CancelJobRunResponse'
  /v1/admin/jobs:
    get:
      tags:
        - MetaJobsService
      summary: ListJobs
      description: ListJobs lists every background job with its schedule and last run.
      operationId: MetaJobsService_ListJobs
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListJobsResponse'
  /v1/admin/jobs/{jobId}:
    get:
      tags:
        - MetaJobsService
      summary: GetJob
      description: GetJob returns one job.
      operationId: MetaJobsService_GetJob
      parameters:
        - name: jobId
          in: path
          description: The jobId path parameter.
          required: true
          schema:
            type: string
            title: job_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetJobResponse'
  /v1/admin/jobs/{jobId}/runs:
    get:
      tags:
        - MetaJobsService
      summary: ListJobRuns
      description: ListJobRuns lists a job's runs, newest first.
      operationId: MetaJobsService_ListJobRuns
      parameters:
        - name: jobId
          in: path
          description: The jobId path parameter.
          required: true
          schema:
            type: string
            title: job_id
        - name: pageSize
          in: query
          description: 1..100, default 20.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The pageToken query parameter.
          schema:
            type: string
            title: page_token
        - name: status
          in: query
          description: Only runs with this status.
          schema:
            allOf:
              - $ref: '#/components/schemas/panelarr.meta.v1.JobRunStatus'
            title: status
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListJobRunsResponse'
  /v1/admin/jobs/{jobId}:run:
    post:
      tags:
        - MetaJobsService
      summary: RunJob
      description: |-
        RunJob starts a run now and returns at once. A job runs once at a time:
         when it is already running the answer is ALREADY_EXISTS (HTTP 409) with
         a JobAlreadyRunning detail naming the current run.
      operationId: MetaJobsService_RunJob
      parameters:
        - name: jobId
          in: path
          description: The jobId path parameter.
          required: true
          schema:
            type: string
            title: job_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  title: params
                  additionalProperties:
                    type: string
                    title: value
                  description: Values for the job's params, as strings ("true", "100", "a,b").
              title: RunJobRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RunJobResponse'
  /v1/admin/profiles:
    get:
      tags:
        - MetaIntegrationsService
