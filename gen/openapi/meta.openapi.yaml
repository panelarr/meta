openapi: 3.1.0
info:
  title: meta API
  description: |
    meta serves a metadata catalogue for manga, manhwa, manhua and comics: browse with
    filters, search across titles in every language, entry details with attribution,
    lookups by external ID, and provider administration.

    Every call needs an API key, sent as `Authorization: Bearer <key>`. The same API is
    also served over gRPC and Connect.
  version: v1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        Represents a JSON `null`.

         `NullValue` is a sentinel, using an enum with only one value to represent
         the null value for the `Value` type union.

         A field of type `NullValue` with any value other than `0` is considered
         invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
         as a JSON `null` regardless of the integer value, and so will round trip to
         a `0` value.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    panelarr.meta.v1.BrowseRequest:
      type: object
      properties:
        filter:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntryFilter'
          title: filter
        sort:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SortField'
          title: sort
        reverse:
          type: boolean
          title: reverse
          description: Reverse the sort's natural direction.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: 1..100, default 24.
        pageToken:
          type: string
          title: page_token
        language:
          type: string
          title: language
          description: Preferred language for display titles (BCP 47).
      title: BrowseRequest
      additionalProperties: false
    panelarr.meta.v1.BrowseResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.EntrySummary'
          title: entries
        nextPageToken:
          type: string
          title: next_page_token
        totalSize:
          type: string
          title: total_size
          format: int64
          description: Number of matching entries.
        noProviders:
          type: boolean
          title: no_providers
          description: |-
            True when meta has no providers configured, so an empty result means
             "nothing set up" rather than "nothing matched".
      title: BrowseResponse
      additionalProperties: false
    panelarr.meta.v1.Entry:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: type
        rawType:
          type: string
          title: raw_type
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: status
        rawStatus:
          type: string
          title: raw_status
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        rawContentRating:
          type: string
          title: raw_content_rating
        titles:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Title'
          title: titles
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Description'
          title: descriptions
        credits:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Credit'
          title: credits
        companies:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.CompanyCredit'
          title: companies
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.License'
          title: licenses
        tags:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.TagAssignment'
          title: tags
        relations:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Relation'
          title: relations
        adaptations:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Adaptation'
          title: adaptations
        items:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Item'
          title: items
        progress:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Progress'
          title: progress
        dates:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Dates'
          title: dates
        originalLanguage:
          type: string
          title: original_language
        images:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Image'
          title: images
        links:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Link'
          title: links
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: external_ids
        stats:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.ProviderStats'
          title: stats
          description: Each provider's numbers, kept apart because they are not comparable.
        state:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryState'
          title: state
        mergedInto:
          type: string
          title: merged_into
          description: 'When state is merged: the entry this one was merged into.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.EntrySource'
          title: sources
          description: The provider records this entry is built from.
        fieldSources:
          type: object
          title: field_sources
          additionalProperties:
            type: string
            title: value
          description: |-
            Which provider each field came from: field name -> provider key, or
             "manual" for fields a curator set.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Entry
      additionalProperties: false
      description: |-
        Entry is meta's merged record for one catalogue item. Each field comes from
         the provider with the highest priority for it (field_sources says which),
         unless a curator locked the field.
    panelarr.meta.v1.EntryFilter:
      type: object
      properties:
        genres:
          type: array
          items:
            type: string
          title: genres
          description: Genre names.
        tags:
          type: array
          items:
            type: string
          title: tags
          description: Tag names. An entry must have all of them.
        excludeTags:
          type: array
          items:
            type: string
          title: exclude_tags
          description: Tag or genre names to leave out.
        types:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: types
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: statuses
        contentRatings:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_ratings
        languages:
          type: array
          items:
            type: string
          title: languages
          description: Original languages (BCP 47), e.g. "ja", "ko".
        yearFrom:
          type: integer
          title: year_from
          format: int32
          description: Start year range, inclusive. 0 means open.
        yearTo:
          type: integer
          title: year_to
          format: int32
        titleLanguages:
          type: array
          items:
            type: string
          title: title_languages
          description: Only entries with titles in one of these languages.
        includeInactive:
          type: boolean
          title: include_inactive
          description: Include merged and removed entries. Off by default.
      title: EntryFilter
      additionalProperties: false
      description: |-
        EntryFilter narrows Browse and Search. Repeated fields match any of their
         values; different fields must all match.
    panelarr.meta.v1.EntrySource:
      type: object
      properties:
        ref:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: ref
        attribution:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Attribution'
          title: attribution
        state:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryState'
          title: state
        fetchedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: fetched_at
          description: When meta last received the record.
        providerUpdatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: provider_updated_at
          description: When the provider last changed it, if known.
      title: EntrySource
      additionalProperties: false
      description: EntrySource is one provider record behind an entry.
    panelarr.meta.v1.EntrySummary:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
          description: |-
            The display title: the primary title in the requested language when
             there is one, otherwise the main title.
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: type
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: status
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        originalLanguage:
          type: string
          title: original_language
        year:
          type: integer
          title: year
          format: int32
          description: Year the work started, 0 if unknown.
        cover:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Image'
          title: cover
        genres:
          type: array
          items:
            type: string
          title: genres
          description: Genre names.
        rating:
          type:
            - number
            - "null"
          title: rating
          format: double
          description: Rating on a 0..100 scale from the preferred provider, if any.
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Attribution'
          title: attributions
          description: Who the data comes from.
      title: EntrySummary
      additionalProperties: false
      description: EntrySummary is the short form of an entry used in lists.
    panelarr.meta.v1.GetEntryRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        language:
          type: string
          title: language
      title: GetEntryRequest
      additionalProperties: false
    panelarr.meta.v1.GetEntryResponse:
      type: object
      properties:
        entry:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.Entry'
          title: entry
        redirectedFrom:
          type: string
          title: redirected_from
          description: |-
            Set when the requested ID was merged and the response is the entry it
             was merged into.
      title: GetEntryResponse
      additionalProperties: false
    panelarr.meta.v1.GetSyncRunRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: GetSyncRunRequest
      additionalProperties: false
    panelarr.meta.v1.GetSyncRunResponse:
      type: object
      properties:
        run:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SyncRun'
          title: run
      title: GetSyncRunResponse
      additionalProperties: false
    panelarr.meta.v1.ListProvidersRequest:
      type: object
      title: ListProvidersRequest
      additionalProperties: false
    panelarr.meta.v1.ListProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.Provider'
          title: providers
      title: ListProvidersResponse
      additionalProperties: false
    panelarr.meta.v1.ListSyncRunsRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: Only runs of this provider.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: 1..100, default 20.
        pageToken:
          type: string
          title: page_token
      title: ListSyncRunsRequest
      additionalProperties: false
    panelarr.meta.v1.ListSyncRunsResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.SyncRun'
          title: runs
        nextPageToken:
          type: string
          title: next_page_token
      title: ListSyncRunsResponse
      additionalProperties: false
    panelarr.meta.v1.ListTagsRequest:
      type: object
      properties:
        genresOnly:
          type: boolean
          title: genres_only
          description: Only genres.
        prefix:
          type: string
          title: prefix
          description: Prefix filter on the name, case-insensitive.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: 1..1000, default 200.
        pageToken:
          type: string
          title: page_token
      title: ListTagsRequest
      additionalProperties: false
    panelarr.meta.v1.ListTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Tag'
          title: tags
        nextPageToken:
          type: string
          title: next_page_token
      title: ListTagsResponse
      additionalProperties: false
    panelarr.meta.v1.LookupExternalRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: Provider key, e.g. "anilist", "mal", "mangabaka".
        externalId:
          type: string
          title: external_id
        refresh:
          type: boolean
          title: refresh
          description: Ask a plugin even if meta already knows the ID, to get fresh data.
        language:
          type: string
          title: language
      title: LookupExternalRequest
      additionalProperties: false
    panelarr.meta.v1.LookupExternalResponse:
      type: object
      properties:
        entry:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.Entry'
          title: entry
      title: LookupExternalResponse
      additionalProperties: false
    panelarr.meta.v1.Provider:
      type: object
      properties:
        id:
          type: string
          title: id
          description: The provider key, e.g. "mangabaka".
        mode:
          type: string
          title: mode
          description: 'How meta reaches the plugin: "managed" or "remote".'
        info:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.PluginInfo'
          title: info
          description: What the plugin reported in GetInfo. Empty if it couldn't be reached.
        health:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.HealthStatus'
          title: health
        healthMessage:
          type: string
          title: health_message
        schedules:
          type: object
          title: schedules
          additionalProperties:
            type: string
            title: value
          description: 'Schedules per ingestion kind (cron expressions), e.g. {"dump": "0 3 * * *"}.'
        lastRuns:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.SyncRun'
          title: last_runs
          description: The latest run per ingestion kind.
        recordCount:
          type: string
          title: record_count
          format: int64
          description: Number of provider records stored.
      title: Provider
      additionalProperties: false
    panelarr.meta.v1.ProviderStats:
      type: object
      properties:
        provider:
          type: string
          title: provider
        stats:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Stats'
          title: stats
      title: ProviderStats
      additionalProperties: false
    panelarr.meta.v1.RefreshEntryRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: RefreshEntryRequest
      additionalProperties: false
    panelarr.meta.v1.RefreshEntryResponse:
      type: object
      properties:
        refreshed:
          type: array
          items:
            type: string
          title: refreshed
          description: Providers that returned fresh data.
        failed:
          type: object
          title: failed
          additionalProperties:
            type: string
            title: value
          description: Providers that failed, with the reason.
      title: RefreshEntryResponse
      additionalProperties: false
    panelarr.meta.v1.RunSyncRequest:
      type: object
      properties:
        provider:
          type: string
          title: provider
        kind:
          type: string
          title: kind
          description: '"dump" or "delta".'
        force:
          type: boolean
          title: force
          description: Run even if the plugin reports nothing changed.
      title: RunSyncRequest
      additionalProperties: false
    panelarr.meta.v1.RunSyncResponse:
      type: object
      properties:
        run:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SyncRun'
          title: run
      title: RunSyncResponse
      additionalProperties: false
    panelarr.meta.v1.SearchHit:
      type: object
      properties:
        entry:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntrySummary'
          title: entry
        score:
          type: number
          title: score
          format: double
          description: Relevance, higher is better. Only comparable within one response.
        matched:
          type: string
          title: matched
          description: The title or name that matched.
        matchedField:
          type: string
          title: matched_field
          description: 'What matched: "title" or "person".'
      title: SearchHit
      additionalProperties: false
    panelarr.meta.v1.SearchRequest:
      type: object
      properties:
        query:
          type: string
          title: query
        filter:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntryFilter'
          title: filter
        sort:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SortField'
          title: sort
          description: Defaults to relevance.
        reverse:
          type: boolean
          title: reverse
        pageSize:
          type: integer
          title: page_size
          format: int32
        pageToken:
          type: string
          title: page_token
        language:
          type: string
          title: language
      title: SearchRequest
      additionalProperties: false
    panelarr.meta.v1.SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.SearchHit'
          title: hits
        nextPageToken:
          type: string
          title: next_page_token
        totalSize:
          type: string
          title: total_size
          format: int64
        noProviders:
          type: boolean
          title: no_providers
      title: SearchResponse
      additionalProperties: false
    panelarr.meta.v1.SortField:
      type: string
      title: SortField
      enum:
        - SORT_FIELD_UNSPECIFIED
        - SORT_FIELD_POPULARITY
        - SORT_FIELD_RATING
        - SORT_FIELD_UPDATED
        - SORT_FIELD_YEAR
        - SORT_FIELD_TITLE
        - SORT_FIELD_RELEVANCE
    panelarr.meta.v1.SyncRun:
      type: object
      properties:
        id:
          type: string
          title: id
        provider:
          type: string
          title: provider
        kind:
          type: string
          title: kind
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SyncRunStatus'
          title: status
        trigger:
          type: string
          title: trigger
          description: '"manual" or "schedule".'
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
        snapshotId:
          type: string
          title: snapshot_id
        cursorStart:
          type: string
          title: cursor_start
          description: The cursor the run started from and the last one it committed.
        cursorEnd:
          type: string
          title: cursor_end
        upserts:
          type: string
          title: upserts
          format: int64
          description: Records received.
        changed:
          type: string
          title: changed
          format: int64
          description: Records that changed what meta had stored.
        removals:
          type: string
          title: removals
          format: int64
        merges:
          type: string
          title: merges
          format: int64
        skipped:
          type: string
          title: skipped
          format: int64
        markedRemoved:
          type: string
          title: marked_removed
          format: int64
          description: Records marked removed because a full snapshot no longer had them.
        error:
          type: string
          title: error
          description: Error message when the run failed.
        notices:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.SyncRunNotice'
          title: notices
          description: Warnings and errors the plugin reported, newest last (capped).
        progress:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: progress
          description: Last progress report, e.g. download bytes.
      title: SyncRun
      additionalProperties: false
    panelarr.meta.v1.SyncRunNotice:
      type: object
      properties:
        level:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.NoticeLevel'
          title: level
        message:
          type: string
          title: message
        ref:
          type: string
          title: ref
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
      title: SyncRunNotice
      additionalProperties: false
    panelarr.meta.v1.SyncRunStatus:
      type: string
      title: SyncRunStatus
      enum:
        - SYNC_RUN_STATUS_UNSPECIFIED
        - SYNC_RUN_STATUS_RUNNING
        - SYNC_RUN_STATUS_SUCCEEDED
        - SYNC_RUN_STATUS_FAILED
        - SYNC_RUN_STATUS_CANCELLED
    panelarr.metadata.v1.Adaptation:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.AdaptationType'
          title: type
        rawType:
          type: string
          title: raw_type
        title:
          type: string
          title: title
        start:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Ref'
          title: start
          description: Where in the source work the adaptation starts and ends.
        end:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Ref'
          title: end
        dates:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Dates'
          title: dates
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: external_ids
      title: Adaptation
      additionalProperties: false
      description: |-
        Adaptation is the work in another medium (anime, live action, games, ...),
         which may not be in meta at all.
    panelarr.metadata.v1.AdaptationType:
      type: string
      title: AdaptationType
      enum:
        - ADAPTATION_TYPE_UNSPECIFIED
        - ADAPTATION_TYPE_ANIME
        - ADAPTATION_TYPE_ANIME_MOVIE
        - ADAPTATION_TYPE_ANIME_SHORT
        - ADAPTATION_TYPE_ANIME_OVA
        - ADAPTATION_TYPE_ANIME_ONA
        - ADAPTATION_TYPE_ANIME_SPECIAL
        - ADAPTATION_TYPE_LIVE_ACTION_SERIES
        - ADAPTATION_TYPE_LIVE_ACTION_MOVIE
        - ADAPTATION_TYPE_LIVE_ACTION_SPECIAL
        - ADAPTATION_TYPE_TV_DRAMA
        - ADAPTATION_TYPE_MOVIE
        - ADAPTATION_TYPE_SHORT_FILM
        - ADAPTATION_TYPE_WEB_SERIES
