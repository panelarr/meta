        month:
          type: integer
          title: month
          format: int32
        day:
          type: integer
          title: day
          format: int32
        estimated:
          type: boolean
          title: estimated
          description: The provider marked the date as an estimate.
      title: PartialDate
      additionalProperties: false
      description: |-
        PartialDate is a date where only some parts may be known. Many sources only
         know a year. Zero means unknown.
