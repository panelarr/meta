openapi: 3.1.0
info:
  title: meta API
  description: |
    meta serves a metadata catalogue for manga, manhwa, manhua and comics: browse with
    filters, search across titles in every language, entry details with attribution,
    lookups by external ID, and provider administration.

    Every call needs a bearer token, `Authorization: Bearer <token>`: the admin token, or a
    client API key with the scopes the call needs (`catalog:read` for the catalogue, `admin`
    for everything else). The same API is also served over gRPC and Connect.
  version: v1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        Represents a JSON `null`.

         `NullValue` is a sentinel, using an enum with only one value to represent
         the null value for the `Value` type union.

         A field of type `NullValue` with any value other than `0` is considered
         invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
         as a JSON `null` regardless of the integer value, and so will round trip to
         a `0` value.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    panelarr.meta.v1.AssignProfileRequest:
      type: object
      properties:
        providerId:
          type: string
          title: provider_id
        profileId:
          type: string
          title: profile_id
      title: AssignProfileRequest
      additionalProperties: false
    panelarr.meta.v1.AssignProfileResponse:
      type: object
      properties:
        assignment:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.Assignment'
          title: assignment
      title: AssignProfileResponse
      additionalProperties: false
    panelarr.meta.v1.Assignment:
      type: object
      properties:
        providerId:
          type: string
          title: provider_id
        profileId:
          type: string
          title: profile_id
          description: Profile assigned here. Empty when none.
        pushedProfileName:
          type: string
          title: pushed_profile_name
          description: |-
            Name of the profile pushed by a host, when there is one. It wins over
             profile_id.
        effective:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.ProfileOrigin'
          title: effective
          description: Where the effective settings come from.
        effectiveProfileId:
          type: string
          title: effective_profile_id
          description: The profile in effect when it's a local one (assigned or default).
        supported:
          type: boolean
          title: supported
          description: |-
            Whether the provider's plugin applies network profiles (it declares the
             `network_profile` common service). Profiles have no effect on others.
        pushedProfile:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.NetworkProfile'
          title: pushed_profile
          description: |-
            The profile pushed by a host, as meta hands it to the plugin, so the host
             can show it and notice drift. Unset when nothing is pushed. The proxy
             password is never returned: see pushed_proxy_password_set.
        pushedProxyPasswordSet:
          type: boolean
          title: pushed_proxy_password_set
          description: Whether the pushed profile has a proxy password (stored encrypted).
        pushedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: pushed_at
          description: When the host last pushed the profile.
      title: Assignment
      additionalProperties: false
    panelarr.meta.v1.BrowseRequest:
      type: object
      properties:
        filter:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntryFilter'
          title: filter
        sort:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.SortField'
          title: sort
        reverse:
          type: boolean
          title: reverse
          description: Reverse the sort's natural direction.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: 1..100, default 24.
        pageToken:
          type: string
          title: page_token
        language:
          type: string
          title: language
          description: Preferred language for display titles (BCP 47).
        facets:
          type: boolean
          title: facets
          description: |-
            Ask for counts per filter value. Only a search engine backend has
             them; with PostgreSQL the response has none.
      title: BrowseRequest
      additionalProperties: false
    panelarr.meta.v1.BrowseResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.EntrySummary'
          title: entries
        nextPageToken:
          type: string
          title: next_page_token
        totalSize:
          type: string
          title: total_size
          format: int64
          description: Number of matching entries.
        noProviders:
          type: boolean
          title: no_providers
          description: |-
            True when meta has no providers configured, so an empty result means
             "nothing set up" rather than "nothing matched".
        facets:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.Facet'
          title: facets
          description: |-
            Counts per filter value among all matches, when asked for and the
             search backend has them.
      title: BrowseResponse
      additionalProperties: false
    panelarr.meta.v1.CancelJobRunRequest:
      type: object
      properties:
        runId:
          type: string
          title: run_id
      title: CancelJobRunRequest
      additionalProperties: false
    panelarr.meta.v1.CancelJobRunResponse:
      type: object
      properties:
        run:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.JobRunSummary'
          title: run
      title: CancelJobRunResponse
      additionalProperties: false
    panelarr.meta.v1.Client:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        scopes:
          type: array
          items:
            type: string
          title: scopes
        keyPrefix:
          type: string
          title: key_prefix
          description: First characters of the key, to tell keys apart. Not enough to use it.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        rotatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: rotated_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
      title: Client
      additionalProperties: false
    panelarr.meta.v1.ComponentHealth:
      type: object
      properties:
        name:
          type: string
          title: name
          description: '"database", "search" or "provider:<id>".'
        kind:
          type: string
          title: kind
          description: '"database", "search" or "provider".'
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.HealthStatus'
          title: status
        message:
          type: string
          title: message
        latency:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: latency
          description: How long the check took.
        checkedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: checked_at
        details:
          type: object
          title: details
          additionalProperties:
            type: string
            title: value
          description: Extra facts, e.g. the search backend's capabilities or a plugin's version.
      title: ComponentHealth
      additionalProperties: false
    panelarr.meta.v1.ConfirmDuplicateRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        keep:
          type: string
          title: keep
          description: 'The entry that stays: "a" or "b". Empty keeps the more popular one.'
        note:
          type: string
          title: note
      title: ConfirmDuplicateRequest
      additionalProperties: false
    panelarr.meta.v1.ConfirmDuplicateResponse:
      type: object
      properties:
        pair:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.DuplicatePair'
          title: pair
        entryId:
          type: string
          title: entry_id
          description: The entry the two are now.
      title: ConfirmDuplicateResponse
      additionalProperties: false
    panelarr.meta.v1.CreateClientRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        scopes:
          type: array
          items:
            type: string
          title: scopes
      title: CreateClientRequest
      additionalProperties: false
    panelarr.meta.v1.CreateClientResponse:
      type: object
      properties:
        client:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.Client'
          title: client
        apiKey:
          type: string
          title: api_key
          description: The API key. Shown only in this response.
      title: CreateClientResponse
      additionalProperties: false
    panelarr.meta.v1.DecisionJudgeSettings:
      type: object
      properties:
        enabled:
          type: boolean
          title: enabled
          description: |-
            The model rates the best pairs after each duplicates run. Off by
             default: nothing is sent anywhere until it is on.
        kind:
          type: string
          title: kind
          description: '"openai", "typesafe" or "clef".'
        url:
          type: string
          title: url
          description: Base URL (default the provider's); for clef the model's run URL.
        model:
          type: string
          title: model
          description: 'Default: gpt-6-luna (openai), jev-latest (typesafe), clef.'
        apiKey:
          type: string
          title: api_key
          description: 'Input only: never returned. Empty keeps the stored key.'
        hasApiKey:
          type: boolean
          title: has_api_key
          description: Output only.
        covers:
          type: boolean
          title: covers
          description: Send cover images to models that take them (openai, clef).
        origin:
          type: string
          title: origin
          description: 'Output only: "config" or "admin".'
      title: DecisionJudgeSettings
      additionalProperties: false
    panelarr.meta.v1.DeleteClientRequest:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
      title: DeleteClientRequest
      additionalProperties: false
    panelarr.meta.v1.DeleteClientResponse:
      type: object
      title: DeleteClientResponse
      additionalProperties: false
    panelarr.meta.v1.DeleteProfileRequest:
      type: object
      properties:
        profileId:
          type: string
          title: profile_id
      title: DeleteProfileRequest
      additionalProperties: false
    panelarr.meta.v1.DeleteProfileResponse:
      type: object
      title: DeleteProfileResponse
      additionalProperties: false
    panelarr.meta.v1.DeleteSolverRequest:
      type: object
      properties:
        solverId:
          type: string
          title: solver_id
      title: DeleteSolverRequest
      additionalProperties: false
    panelarr.meta.v1.DeleteSolverResponse:
      type: object
      title: DeleteSolverResponse
      additionalProperties: false
    panelarr.meta.v1.DismissDuplicateRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        note:
          type: string
          title: note
      title: DismissDuplicateRequest
      additionalProperties: false
    panelarr.meta.v1.DismissDuplicateResponse:
      type: object
      properties:
        pair:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.DuplicatePair'
          title: pair
      title: DismissDuplicateResponse
      additionalProperties: false
    panelarr.meta.v1.DuplicatePair:
      type: object
      properties:
        id:
          type: string
          title: id
          format: int64
        entryA:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntrySummary'
          title: entry_a
        entryB:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.EntrySummary'
          title: entry_b
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.DuplicateStatus'
          title: status
        score:
          type: number
          title: score
          format: double
          description: '0..1: how likely meta''s own comparison thinks the two are one work.'
        signals:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.DuplicateSignals'
          title: signals
        verdict:
          allOf:
            - $ref: '#/components/schemas/panelarr.meta.v1.DuplicateVerdict'
          title: verdict
          description: The decision model's answer, if one was asked.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        decidedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: decided_at
        decidedBy:
          type: string
          title: decided_by
          description: 'Who decided: "admin" or a client''s name.'
        note:
          type: string
          title: note
      title: DuplicatePair
      additionalProperties: false
    panelarr.meta.v1.DuplicateSignals:
      type: object
      properties:
        title:
          type: number
          title: title
          format: double
          description: 'Best title similarity (1: the same normalized title) and the titles.'
        titleA:
          type: string
          title: title_a
        titleB:
          type: string
          title: title_b
        people:
          type: number
          title: people
          format: double
          description: Share of credited people in common (0..1); -1 when a side has none.
        sharedPeople:
          type: array
          items:
            type: string
          title: shared_people
        yearA:
          type: integer
          title: year_a
          format: int32
        yearB:
          type: integer
          title: year_b
          format: int32
        typeA:
          type: string
          title: type_a
        typeB:
          type: string
          title: type_b
        languageA:
          type: string
          title: language_a
        languageB:
          type: string
          title: language_b
        sharedIds:
          type: array
          items:
            type: string
          title: shared_ids
          description: IDs at another site both report ("anilist:30013").
        sameProvider:
          type: boolean
          title: same_provider
          description: |-
            Both come from the same provider, which keeps records apart on
             purpose unless its data has duplicates.
      title: DuplicateSignals
      additionalProperties: false
      description: What the score is made of.
    panelarr.meta.v1.DuplicateStatus:
      type: string
      title: DuplicateStatus
      enum:
        - DUPLICATE_STATUS_UNSPECIFIED
        - DUPLICATE_STATUS_OPEN
        - DUPLICATE_STATUS_CONFIRMED
        - DUPLICATE_STATUS_DISMISSED
    panelarr.meta.v1.DuplicateVerdict:
      type: object
      properties:
        judge:
          type: string
          title: judge
          description: '"openai", "typesafe" or "clef", and the model.'
        model:
          type: string
          title: model
        same:
          type: number
          title: same
          format: double
          description: Probability that the two are the same work.
        choice:
          type: string
          title: choice
          description: |-
            "same_work", "related_work" or "different", with every option's
             probability.
        probabilities:
          type: object
          title: probabilities
          additionalProperties:
            type: number
            title: value
            format: double
        confidence:
          type: number
          title: confidence
          format: double
        tokens:
          type: string
          title: tokens
          format: int64
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
      title: DuplicateVerdict
      additionalProperties: false
      description: A decision model's answer. Models give probabilities, not reasons.
    panelarr.meta.v1.Entry:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: type
        rawType:
          type: string
          title: raw_type
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: status
        rawStatus:
          type: string
          title: raw_status
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        rawContentRating:
          type: string
          title: raw_content_rating
        titles:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Title'
          title: titles
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Description'
          title: descriptions
        credits:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Credit'
          title: credits
        companies:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.CompanyCredit'
          title: companies
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.License'
          title: licenses
        tags:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.TagAssignment'
          title: tags
        relations:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Relation'
          title: relations
        adaptations:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Adaptation'
          title: adaptations
        items:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Item'
          title: items
        progress:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Progress'
          title: progress
        dates:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Dates'
          title: dates
        originalLanguage:
          type: string
          title: original_language
        images:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Image'
          title: images
        links:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Link'
          title: links
        externalIds:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: external_ids
        stats:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.ProviderStats'
          title: stats
          description: Each provider's numbers, kept apart because they are not comparable.
        state:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryState'
          title: state
        mergedInto:
          type: string
          title: merged_into
          description: 'When state is merged: the entry this one was merged into.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.meta.v1.EntrySource'
          title: sources
          description: The provider records this entry is built from.
        fieldSources:
          type: object
          title: field_sources
          additionalProperties:
            type: string
            title: value
          description: |-
            Which provider each field came from: field name -> provider key, or
             "manual" for fields a curator set.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Entry
      additionalProperties: false
      description: |-
        Entry is meta's merged record for one catalogue item. Each field comes from
         the provider with the highest priority for it (field_sources says which),
         unless a curator locked the field.
    panelarr.meta.v1.EntryFilter:
      type: object
      properties:
        genres:
          type: array
          items:
            type: string
          title: genres
          description: Genres, by key ("genre/romance") or name. An entry must have any of them.
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            Tags, by key ("tag/settings/school") or name. An entry must have all of
             them.
        excludeTags:
          type: array
          items:
            type: string
          title: exclude_tags
          description: Tags or genres, by key or name, to leave out.
        types:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: types
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: statuses
        contentRatings:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_ratings
        languages:
          type: array
          items:
            type: string
          title: languages
          description: Original languages (BCP 47), e.g. "ja", "ko".
        yearFrom:
          type: integer
          title: year_from
          format: int32
          description: Start year range, inclusive. 0 means open.
        yearTo:
          type: integer
          title: year_to
          format: int32
        titleLanguages:
          type: array
          items:
            type: string
          title: title_languages
          description: Only entries with titles in one of these languages.
        includeInactive:
          type: boolean
          title: include_inactive
          description: Include merged and removed entries. Off by default.
      title: EntryFilter
      additionalProperties: false
      description: |-
        EntryFilter narrows Browse and Search. Repeated fields match any of their
         values; different fields must all match.
    panelarr.meta.v1.EntrySource:
      type: object
      properties:
        ref:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ExternalId'
          title: ref
        attribution:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Attribution'
          title: attribution
        state:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryState'
          title: state
        fetchedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: fetched_at
          description: When meta last received the record.
        providerUpdatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: provider_updated_at
          description: When the provider last changed it, if known.
      title: EntrySource
      additionalProperties: false
      description: EntrySource is one provider record behind an entry.
    panelarr.meta.v1.EntrySummary:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
          description: |-
            The display title: the primary title in the requested language when
             there is one, otherwise the main title.
        type:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryType'
          title: type
        status:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.EntryStatus'
          title: status
        contentRating:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.ContentRating'
          title: content_rating
        originalLanguage:
          type: string
          title: original_language
        year:
          type: integer
          title: year
          format: int32
          description: Year the work started, 0 if unknown.
        cover:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Image'
          title: cover
        genres:
          type: array
          items:
            type: string
          title: genres
          description: Genre names, in the order the provider lists them.
        rating:
          type:
            - number
            - "null"
          title: rating
          format: double
          description: Rating on a 0..100 scale from the preferred provider, if any.
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Attribution'
          title: attributions
          description: Who the data comes from.
      title: EntrySummary
      additionalProperties: false
      description: EntrySummary is the short form of an entry used in lists.
    panelarr.meta.v1.Facet:
      type: object
      properties:
        field:
          type: string
          title: field
          description: |-
