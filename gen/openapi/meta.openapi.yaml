          type: string
          title: url
      title: ImageVariant
      additionalProperties: false
    panelarr.metadata.v1.Ingestion:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: |-
            Well-known kinds:
               "lookup": on-demand Search/Get through a provider API;
               "scrape": on-demand Search/Get by fetching and parsing pages;
               "dump":   download a full snapshot and stream every record (Sync);
               "delta":  stream only the changes since a cursor (Sync).
             The list is open: hosts ignore kinds they don't know.
        description:
          type: string
          title: description
        limits:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.Limits'
          title: limits
        scheduleHint:
          type: string
          title: schedule_hint
          description: |-
            A suggested schedule for Sync-based kinds, as a cron expression
             ("0 3 * * *"). The hoster decides the real schedule.
        fullSnapshot:
          type: boolean
          title: full_snapshot
          description: |-
            A Sync of this kind lists every record the provider has, so the host
             may mark records that did not appear as removed.
      title: Ingestion
      additionalProperties: false
      description: Ingestion is one way a plugin gets data to meta.
    panelarr.metadata.v1.Item:
      type: object
      properties:
        unit:
          allOf:
            - $ref: '#/components/schemas/panelarr.metadata.v1.RefUnit'
          title: unit
        rawUnit:
          type: string
          title: raw_unit
        number:
          type:
            - number
            - "null"
          title: number
          format: double
        value:
          type: string
          title: value
        name:
          type: string
          title: name
        description:
          type: string
          title: description
