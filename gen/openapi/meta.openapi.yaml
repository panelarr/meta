                $ref: '#/components/schemas/panelarr.meta.v1.ListProfilesResponse'
  /v1/admin/profiles/{profile.id}:
    put:
      tags:
        - MetaIntegrationsService
      summary: PutProfile
      description: |-
        PutProfile creates or replaces a profile. A proxy password left empty
         keeps the stored one.
      operationId: MetaIntegrationsService_PutProfile
      parameters:
        - name: profile.id
          in: path
          description: 'Identifier chosen by the admin: lowercase letters, digits and dashes.'
          required: true
          schema:
            type: string
            title: id
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/panelarr.meta.v1.NetworkProfile'
              title: profile
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.PutProfileResponse'
  /v1/admin/profiles/{profileId}:
    delete:
      tags:
        - MetaIntegrationsService
      summary: DeleteProfile
      description: |-
        DeleteProfile also removes the profile's assignments, and clears the
         default when it was the default.
      operationId: MetaIntegrationsService_DeleteProfile
      parameters:
        - name: profileId
          in: path
          description: The profileId path parameter.
          required: true
          schema:
            type: string
            title: profile_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.DeleteProfileResponse'
  /v1/admin/providers:
    get:
      tags:
        - MetaAdminService
      summary: ListProviders
      description: |-
        ListProviders lists the configured metadata plugins with what they
         support, their health and their last sync.
      operationId: MetaAdminService_ListProviders
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.ListProvidersResponse'
  /v1/admin/providers/{provider}/sync:
    post:
      tags:
        - MetaAdminService
      summary: RunSync
      description: |-
        RunSync starts a dump or delta sync now. It returns at once with the new
         run; follow it with GetSyncRun.
      operationId: MetaAdminService_RunSync
      parameters:
        - name: provider
          in: path
          description: The provider path parameter.
          required: true
          schema:
            type: string
            title: provider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  title: kind
                  description: '"dump" or "delta".'
                force:
                  type: boolean
                  title: force
                  description: Run even if the plugin reports nothing changed.
              title: RunSyncRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.RunSyncResponse'
  /v1/admin/pushed-profiles/{providerId}:
    put:
      tags:
        - MetaIntegrationsService
      summary: SetPushedProfile
      description: |-
        SetPushedProfile is how a host that owns network settings (a Panelarr
         server) gives a provider its profile. A pushed profile wins over the local
         assignment and default. Leaving `profile` unset removes the override.
      operationId: MetaIntegrationsService_SetPushedProfile
      parameters:
        - name: providerId
          in: path
          description: The providerId path parameter.
          required: true
          schema:
            type: string
            title: provider_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  allOf:
                    - $ref: '#/components/schemas/panelarr.metadata.v1.NetworkProfile'
                  title: profile
                  description: |-
                    The profile, in the shape plugins receive it (solver inline). Unset
                     removes the pushed profile.
              title: SetPushedProfileRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.SetPushedProfileResponse'
  /v1/admin/search-engine:
    get:
      tags:
        - MetaIntegrationsService
      summary: GetSearchEngine
      description: |-
        GetSearchEngine returns the search backend in force, where its settings
         come from, and the state of its index and change feed. The API key is
         never returned.
      operationId: MetaIntegrationsService_GetSearchEngine
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.GetSearchEngineResponse'
    put:
      tags:
        - MetaIntegrationsService
      summary: PutSearchEngine
      description: |-
        PutSearchEngine saves search engine settings, which then win over the
         configuration file, and switches to them at once. An empty api_key keeps
         the stored key for the same engine and URL. A new or outdated index is
         rebuilt in the background (the search-rebuild job); PostgreSQL answers
         until it is ready.
      operationId: MetaIntegrationsService_PutSearchEngine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/panelarr.meta.v1.PutSearchEngineRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/panelarr.meta.v1.PutSearchEngineResponse'
  /v1/admin/search-engine:reset:
    post:
      tags:
        - MetaIntegrationsService
      summary: ResetSearchEngine
      description: |-
        ResetSearchEngine forgets the admin's settings and goes back to the
         configuration file's.
      operationId: MetaIntegrationsService_ResetSearchEngine
      requestBody:
        content:
          application/json:
            schema:
