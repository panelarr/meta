tags:
  - name: MetaAdminService
    description: MetaAdminService manages providers and their syncs.
  - name: MetaClientsService
    description: |-
      MetaClientsService manages API clients: callers such as a Panelarr server or
       a script, each with its own API key and scopes.

       Scopes:
       - `catalog:read`: browse, search and read the catalogue (MetaService).
       - `metrics:read`: scrape /metrics when it is served on the API port.
       - `admin`: everything, including this service and MetaAdminService.

       Keys are shown once, when created or rotated, and stored only as hashes.
       Every method needs the `admin` scope except WhoAmI, which any valid key may
       call.
  - name: MetaService
    description: |-
      MetaService serves meta's catalogue: discovery (browse), search and
       details over every entry meta knows, not only those in a library.

       Every RPC is available over gRPC, Connect and plain HTTP/JSON (the paths
       in the annotations below).
  - name: MetaDuplicatesService
    description: |-
      MetaDuplicatesService lists entries that are probably the same work but
       aren't linked, and lets a curator confirm (merge) or dismiss each pair.
       Pairs are found by the "duplicates" job (MetaJobsService) and optionally
       rated by a decision model. Nothing merges without a curator. Admin scope.
  - name: MetaIntegrationsService
    description: |-
      MetaIntegrationsService manages the network settings metadata plugins use:
       challenge solvers, network profiles and which profile each provider uses.
       Needs the `admin` scope.

       The chain: a solver is used by a profile (solver_id), and a profile applies
       to the providers it's assigned to, or to every other provider when it's the
       default profile. meta hands the profile in effect to each plugin that
       declares the `network_profile` common service.

       A provider uses, in order: a profile pushed by a host (SetPushedProfile), the
       profile assigned to it here, the default profile, or a direct connection
       when there is none.
  - name: MetaJobsService
    description: |-
      MetaJobsService lists meta's background jobs and their runs, and starts
       and cancels them. Every Panelarr admin has the same messages and REST
       paths (the shared jobs contract), so a common package can be extracted
       later. Admin scope only.
