          title: release_date
        language:
          type: string
          title: language
        links:
          type: array
          items:
            $ref: '#/components/schemas/panelarr.metadata.v1.Link'
          title: links
      title: Item
      additionalProperties: false
      description: 'Item is a known release: a chapter, volume, issue, ...'
