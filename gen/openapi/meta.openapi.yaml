        maxConcurrency:
          type: integer
          title: max_concurrency
          format: int32
          description: Concurrent calls the host may make. 0 means no limit.
      title: Limits
      additionalProperties: false
      description: |-
        Limits tell the host how hard it may use an ingestion type. The host
         enforces them, and plugins should enforce them too.
