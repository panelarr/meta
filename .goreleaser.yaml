# GoReleaser builds the release artifacts when release-please tags a
# version: binaries, archives, checksums, SBOMs and multi-arch images.
version: 2
project_name: meta

before:
  hooks:
    - go mod download
    # The admin UI is embedded into the binary, so it's built first.
    - make admin-setup
    - make admin

builds:
  - id: meta
    main: ./cmd/meta
    binary: meta
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/panelarr/meta/internal/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*
      - meta.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

dockers_v2:
  - id: image
    ids: [meta]
    dockerfile: Dockerfile.release
    images:
      - panelarr/meta
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    extra_files:
      - packaging/data
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: meta
      org.opencontainers.image.description: Panelarr metadata service
      org.opencontainers.image.source: https://github.com/panelarr/meta
      org.opencontainers.image.licenses: GPL-3.0-or-later
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# release-please writes the changelog and creates the GitHub release;
# GoReleaser adds the artifacts to it.
changelog:
  disable: true

release:
  mode: append
