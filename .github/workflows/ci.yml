name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests run as an ordinary role that may only create databases, the same
      # rights meta gets in production. Each test creates and drops its own database.
      META_TEST_DATABASE_URL: postgres://meta:meta@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The admin UI (admin/) is built with Node and embedded into the binary.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Install tools
        run: make setup

      - name: Create the test role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "CREATE ROLE meta LOGIN CREATEDB PASSWORD 'meta'"

      - name: Generated code is up to date
        run: make gen-check

      - name: Check (format, vet, lint, govulncheck, tests)
        run: make check

      - name: Build
        run: make build

  search-engines:
    name: Search engine conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: ci-typesense-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
      meilisearch:
        image: getmeili/meilisearch:v1.54
        env:
          MEILI_MASTER_KEY: ci-meilisearch-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      META_TEST_DATABASE_URL: postgres://meta:meta@localhost:5432/postgres?sslmode=disable
      META_TEST_TYPESENSE_URL: http://localhost:8108
      META_TEST_TYPESENSE_KEY: ci-typesense-key
      META_TEST_MEILISEARCH_URL: http://localhost:7700
      META_TEST_MEILISEARCH_KEY: ci-meilisearch-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create the test role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "CREATE ROLE meta LOGIN CREATEDB PASSWORD 'meta'"

      - name: Wait for the engines
        run: |
          for u in http://localhost:8108/health http://localhost:7700/health; do
            for i in $(seq 60); do curl -fsS "$u" && break; sleep 2; done
          done

      # The admin UI isn't needed: the engine tests don't serve it.
      - name: Conformance, change feed and end-to-end tests on Typesense and Meilisearch
        run: go test -count=1 ./internal/search/... && go test -count=1 -run TestServeWithSearchEngine ./cmd/meta

  proto-breaking:
    name: Proto breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf breaking against main
        run: |
          if git ls-tree -d --name-only origin/main proto | grep -q proto; then
            buf breaking --against "${{ github.event.repository.clone_url }}#branch=main"
          else
            echo "main has no protos yet; nothing to compare"
          fi
